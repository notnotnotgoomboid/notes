<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  html { min-height: 100%; cursor: pointer; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f1f3f4;
    color: #3c4043;
    font: 16px/1.4 system-ui, sans-serif;
  }
</style>
</head>
<body>
<p id="msg">Click anywhere to continue</p>

<script>

const GAMES = {
  eagler: "https://eaglercraft.q13x.com/1.8.8_2/js/",
  karlson: "karlson.html",
  ultrakill: "ultrakill.html",
  karlson2D: "karlson2D.html",
};
const TAB_TITLE = "Google Docs";
const TAB_ICON = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"; 
const NO_GAME_REDIRECT = "https://docs.google.com/"; 
const REDIRECT_THIS_TAB_TO = ""; 

const id = new URLSearchParams(location.search).get("g");

if (!Object.prototype.hasOwnProperty.call(GAMES, id)) {
  window.location.replace(NO_GAME_REDIRECT);
} else {
  const gameUrl = GAMES[id];
  let opened = null;

  function launch(url) {
    const win = window.open("about:blank", "_blank");
    if (!win) return null; 

    const doc = win.document;
    doc.title = TAB_TITLE;

    if (TAB_ICON) {
      const icon = doc.createElement("link");
      icon.rel = "icon";
      icon.href = TAB_ICON;
      doc.head.appendChild(icon);
    }

    doc.body.style.margin = "0";

    const frame = doc.createElement("iframe");
    frame.src = new URL(url, location.href).href;
    frame.allow = "fullscreen; autoplay; clipboard-read; clipboard-write";
    frame.style.cssText =
      "position:fixed;top:0;left:0;width:100vw;height:100vh;border:none";
    doc.body.appendChild(frame);
    return win;
  }

  function openGame() {
    if (opened && !opened.closed) return;
    opened = launch(gameUrl);
    if (opened) {
      if (REDIRECT_THIS_TAB_TO) {
        window.location.replace(REDIRECT_THIS_TAB_TO);
      } else {
        document.getElementById("msg").textContent = "Opened in a new tab. Click to reopen.";
      }
    }
  }

  try { openGame(); } catch (e) {}          
  document.addEventListener("click", openGame); 
}
</script>
</body>
</html>
